<title>Türk Mutfağı Malzeme Ağı</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
 :root{--bg:#0e1320;--panel:#151b2b;--kenar:#262e45;--yazi:#e9edf6;--soluk:#8e98b3}
 *{box-sizing:border-box}
 body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--yazi);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
 #yan{width:320px;max-width:100%;padding:20px;overflow:auto;background:var(--panel);border-right:1px solid var(--kenar)}
 #cy{flex:1;min-width:0}
 h1{font-size:20px;margin:0 0 4px;letter-spacing:.2px}
 .alt{color:var(--soluk);font-size:13px;margin:0 0 16px}
 input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--kenar);
      background:var(--bg);color:var(--yazi);font-size:14px;outline:none}
 input[type=text]:focus{border-color:#4cc9f0}
 h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--soluk);margin:20px 0 8px}
 .chip{display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:6px 11px;border-radius:999px;
      border:1px solid var(--kenar);font-size:13px;cursor:pointer;user-select:none;background:var(--bg)}
 .chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
 .chip.kapali{opacity:.35}
 #detay{margin-top:6px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--kenar);font-size:14px;line-height:1.5}
 #detay b{font-size:17px}
 .kom{display:inline-block;margin:3px 5px 0 0;padding:3px 9px;border-radius:8px;background:var(--panel);
      border:1px solid var(--kenar);font-size:12px;cursor:pointer}
 .kom:hover{border-color:#4cc9f0}
 button{margin-top:10px;padding:8px 12px;border-radius:9px;border:1px solid var(--kenar);
      background:var(--bg);color:var(--yazi);cursor:pointer;font-size:13px}
 button:hover{border-color:#4cc9f0}
 .ipucu{color:var(--soluk);font-size:12px;margin-top:14px;line-height:1.5}
 @media(max-width:760px){body{flex-direction:column}#yan{width:100%;height:46%;border-right:0;border-bottom:1px solid var(--kenar)}}
</style></head><body>
<div id="yan">
 <h1>Türk Mutfağı Malzeme Ağı</h1>

const RENK = ["#4cc9f0","#f72585","#b5e48c","#ffb703","#9d4edd","#06d6a0","#ff7b54","#8ecae6","#e5989b","#cdb4db"];
const ARKA = "#0e1320";
const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: VERI.elemanlar,
  layout: {name: "preset"},
  wheelSensitivity: 0.25, minZoom: 0.2, maxZoom: 5,
  style: [
    {selector: "node", style: {
      "background-color": function(e){return RENK[e.data("topluluk") % 10];},
      "width": function(e){return 9 + Math.sqrt(e.data("tarif")) * 0.45;},
      "height": function(e){return 9 + Math.sqrt(e.data("tarif")) * 0.45;},
      "border-width": 1.5, "border-color": ARKA,
      "label": "", "color": "#e9edf6", "font-size": 12, "font-weight": 600,

    {selector: "node.etiket", style: {"label": "data(label)"}},
    {selector: "node.goster", style: {"label": "data(label)", "z-index": 10}},
    {selector: "edge", style: {"curve-style": "haystack", "haystack-radius": 0, "width": 0.7,

  ]
});
document.getElementById("sayim").textContent = VERI.dugum + " malzeme, " + VERI.kenar + " anlamlı bağ";
const liste = document.getElementById("liste");
cy.nodes().forEach(function(n){const o = document.createElement("option"); o.value = n.id(); liste.appendChild(o);});
const filtre = document.getElementById("filtre");
Object.keys(VERI.isimler).forEach(function(k){
  const c = document.createElement("span");
  c.className = "chip"; c.dataset.k = k;
  c.innerHTML = '<i style="background:' + RENK[k % 10] + '"></i>' + VERI.isimler[k] + " (" + VERI.boyutlar[k] + ")";
  c.onclick = function(){c.classList.toggle("kapali"); filtreUygula();};
  filtre.appendChild(c);
});
function filtreUygula(){
  const kapali = {};
  filtre.querySelectorAll(".chip").forEach(function(c){kapali[c.dataset.k] = c.classList.contains("kapali");});
  cy.nodes().forEach(function(n){n.toggleClass("gizli", !!kapali[String(n.data("topluluk"))]);});
}
function sifirla(){
  cy.elements().removeClass("sec sonuk vurgu goster");
  document.getElementById("detay").textContent = "Ağda bir malzemeye tıkla veya yukarıdan ara.";
}
document.getElementById("sifirla").onclick = sifirla;
function goster(n){
  cy.elements().removeClass("sec sonuk vurgu goster");
  const mahalle = n.closedNeighborhood();
  cy.elements().not(mahalle).addClass("sonuk");
  mahalle.nodes().addClass("goster"); n.addClass("sec");
  n.connectedEdges().addClass("vurgu");
  const komsu = n.connectedEdges().map(function(e){
    const diger = e.source().id() === n.id() ? e.target() : e.source();
    return {ad: diger.id(), w: e.data("w")};
  }).sort(function(a, b){return b.w - a.w;}).slice(0, 12);
  document.getElementById("detay").innerHTML =
    "<b>" + n.id() + "</b><br><span style='color:" + RENK[n.data("topluluk") % 10] + "'>&#9679;</span> " +
    VERI.isimler[String(n.data("topluluk"))] +
    "<br>Tarif sayısı: " + n.data("tarif") + "<br>Anlamlı bağ sayısı: " + n.data("derece") +
    "<br>Betweenness (omurga): " + n.data("bt") +
    "<br><br><span style='color:#8e98b3'>En güçlü komşular (birlikte geçtiği tarif sayısı):</span><br>" +
    komsu.map(function(k){return '<span class="kom" data-ad="' + k.ad + '">' + k.ad + " " + k.w + "</span>";}).join("");
  document.querySelectorAll(".kom").forEach(function(el){
    el.onclick = function(){const h = cy.getElementById(el.dataset.ad); goster(h); cy.animate({center: {eles: h}}, {duration: 300});};
  });
}
cy.on("tap", "node", function(ev){goster(ev.target);});
cy.on("tap", function(ev){if(ev.target === cy) sifirla();});
cy.on("mouseover", "node", function(ev){ev.target.addClass("goster");});
cy.on("mouseout", "node", function(ev){
  const n = ev.target;
  if(n.hasClass("sec")) return;
  if(cy.nodes(".sec").nonempty() && !n.hasClass("sonuk")) return;
  n.removeClass("goster");
});
document.getElementById("ara").addEventListener("keydown", function(ev){
  if(ev.key !== "Enter") return;
  const n = cy.getElementById(this.value.trim().toLowerCase());
  if(n.nonempty()){goster(n); cy.animate({center: {eles: n}, zoom: 1.6}, {duration: 450});}
  else{document.getElementById("detay").textContent = "Bu omurga ağında böyle bir malzeme yok.";}
});
</script></body></html>

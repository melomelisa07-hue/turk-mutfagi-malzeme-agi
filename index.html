const RENK = ["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd","#8c564b","#e377c2","#7f7f7f","#bcbd22","#17becf"];
const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: VERI.elemanlar,
  layout: {name: "preset"},
  wheelSensitivity: 0.3,
  style: [
    {selector: "node", style: {
      "background-color": function(e){return RENK[e.data("topluluk") % 10];},
      "width": function(e){return 8 + Math.sqrt(e.data("tarif")) * 0.35;},
      "height": function(e){return 8 + Math.sqrt(e.data("tarif")) * 0.35;},
      "label": "data(label)", "font-size": 10, "min-zoomed-font-size": 9,
      "text-valign": "center", "text-halign": "right"}},
    {selector: "edge", style: {"width": 0.6, "line-color": "#999", "opacity": 0.25}},
    {selector: ".sec", style: {"border-width": 3, "border-color": "#000"}},
    {selector: ".gizli", style: {"display": "none"}}
  ]
});
const liste = document.getElementById("liste");
cy.nodes().forEach(function(n){const o = document.createElement("option"); o.value = n.id(); liste.appendChild(o);});
const filtre = document.getElementById("filtre");
Object.keys(VERI.isimler).forEach(function(k){
  const l = document.createElement("label");
  l.innerHTML = '<input type="checkbox" checked data-k="' + k + '"> <span class="nokta" style="background:' + RENK[k % 10] + '"></span>' + VERI.isimler[k];
  filtre.appendChild(l);
});
function filtreUygula(){
  const acik = {};
  filtre.querySelectorAll("input").forEach(function(c){acik[c.dataset.k] = c.checked;});
  cy.nodes().forEach(function(n){n.toggleClass("gizli", !acik[String(n.data("topluluk"))]);});
}
filtre.addEventListener("change", filtreUygula);
document.getElementById("hepsi").onclick = function(){
  filtre.querySelectorAll("input").forEach(function(c){c.checked = true;}); filtreUygula();
};
function goster(n){
  cy.nodes().removeClass("sec"); n.addClass("sec");
  const komsu = n.connectedEdges().map(function(e){
    const diger = e.source().id() === n.id() ? e.target() : e.source();
    return {ad: diger.id(), w: e.data("w")};
  }).sort(function(a, b){return b.w - a.w;}).slice(0, 10);
  document.getElementById("detay").innerHTML =
    "<strong>" + n.id() + "</strong><br>Topluluk: " + VERI.isimler[String(n.data("topluluk"))] +
    "<br>Tarif sayısı: " + n.data("tarif") + "<br>Omurgadaki bağlantı sayısı: " + n.data("derece") +
    "<br>Betweenness (omurga): " + n.data("bt") +
    "<br><br><em>En güçlü komşular:</em><br>" +
    komsu.map(function(k){return k.ad + " (" + k.w + ")";}).join("<br>");
}
cy.on("tap", "node", function(ev){goster(ev.target);});
document.getElementById("ara").addEventListener("keydown", function(ev){
  if(ev.key !== "Enter") return;
  const n = cy.getElementById(this.value.trim().toLowerCase());
  if(n.nonempty()){goster(n); cy.animate({center: {eles: n}, zoom: 2}, {duration: 400});}
  else{document.getElementById("detay").textContent = "Bu omurga ağında böyle bir malzeme yok.";}
});
